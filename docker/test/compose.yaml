# 結合の試験の相手（tests/integration）。CI と手元の試験の中でだけ立てる。施設の画像サーバーにはつながない。
# 直に `docker compose up` せず、tests/integration/run.mjs から使う（試験だけの資格情報を作り、終わったら片付ける）。
#
# - orthanc：Orthanc の公式のイメージ（Orthanc の作り手のチーム orthancteam が出すもの。DICOMweb のプラグイン入り）。
#   版と digest を固定する（26.9.1。multi-arch の digest）。上げるときは、試験を流してから、
#   docs/round-trip-test.md の「実測で決めること」の版を書き直す。
#   設定は orthanc/orthanc.json（秘密は無い）。利用者とパスワードは、run.mjs が試験のたびに乱数で作り、secret のファイルで渡す。
# - storescp：DCMTK の受け取る側（送り先のダミー）。tsunagi-dicom の「送信」の相手。Orthanc に itest-scp として登録してある。
# - scu：DCMTK の送る側（profile tools。run.mjs が `docker compose run` で使う）。架空の患者の画像を Orthanc へ送る。
#
# 待ち受けは手元（127.0.0.1）だけ。BFF（手元で動かす）が使う Orthanc の HTTP だけを出す。

name: tsunagi-itest

services:
  orthanc:
    image: orthancteam/orthanc:26.9.1@sha256:d2705f2c56547e55ce9bc2250fd22d05d326493b3f3d9fa191ecb7db8ca6b5a2
    environment:
      DICOM_WEB_PLUGIN_ENABLED: "true"
      VERBOSE_STARTUP: "false"
    volumes:
      - ./orthanc/orthanc.json:/etc/orthanc/itest.json:ro
    secrets:
      # /run/secrets の JSON は Orthanc の設定として読まれる（RegisteredUsers）
      - source: orthanc_users
        target: itest-users.json
    ports:
      - "127.0.0.1:${ITEST_ORTHANC_HTTP_PORT:-18042}:8042"
    # 起きたかは run.mjs が試験の資格情報で /system を読んで確かめる（イメージの既定の確かめは使わない）
    healthcheck:
      disable: true
    depends_on:
      storescp:
        condition: service_healthy

  storescp:
    image: tsunagi-itest-dcmtk:local
    build: ./dcmtk
    command:
      - storescp
      - --aetitle
      - ITEST_SCP
      - --output-directory
      - /received
      - --sort-on-study-uid
      - study
      - "11112"
    healthcheck:
      test: ["CMD", "echoscu", "--aetitle", "ITEST_HEALTH", "--call", "ITEST_SCP", "127.0.0.1", "11112"]
      interval: 2s
      timeout: 5s
      retries: 30

  scu:
    image: tsunagi-itest-dcmtk:local
    build: ./dcmtk
    profiles: ["tools"]
    volumes:
      - ${ITEST_DUMP_DIR:?run.mjs から使う}:/dumps:ro

secrets:
  orthanc_users:
    file: ${ITEST_ORTHANC_USERS_FILE:?run.mjs から使う}
