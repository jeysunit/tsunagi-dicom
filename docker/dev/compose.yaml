# 開発・試験用の一式：配る compose（deploy/compose.yaml の tsunagi-dicom と Orthanc）に、
# dicom-test-generator（検査装置のふりをして架空の患者の画像を送る）と、DCMTK の storescp（送信の相手）を足す。
# 架空の患者だけで使う。施設の画像サーバーにはつながない。
#
#   docker/dev/up.sh        # secret を作り、tsunagi-dicom のイメージを作り、一式を立てる（docs/round-trip-test.md）
#
# 流れ：dicom-test-generator →（C-STORE）→ Orthanc → tsunagi-dicom の受信一覧 → tsunagi-dicom の「送信」→ Orthanc →（C-STORE）→ storescp
#
# - deploy/compose.yaml の変数は dev.env で与える（相対のパスは deploy/ から数える）。シェルの環境変数があれば、そちらが先に効く。
# - dicom-test-generator と storescp は、Orthanc の DICOM のネットワーク（dicom）に入る。tsunagi-dicom と Orthanc だけの
#   内部ネットワーク（backend）には入らない。dicom のコンテナどうしの通信は、dev.env の ORTHANC_DICOM_ICC=true で許す
#   （配る compose の既定は止める）。そのため、この compose では dicom-test-generator と storescp から Orthanc の REST に届く（認証は要る）。
# - Orthanc は送り元の IP アドレスを確かめない（docker/dev/orthanc/site.json の DicomCheckModalityHost: false。接続先の Host が
#   コンテナの名前のため）。
# - dicom-test-generator の Web 画面は 127.0.0.1:${DEV_TDG_WEB_PORT:-18080} に公開する（利用者 dtg、HTTP Basic）。
# - dicom-test-generator の時間帯は Asia/Tokyo（Orthanc と同じ）。コンテナの既定の UTC のままだと、検査日・時刻（StudyDate・StudyTime）を
#   UTC の時刻で書き、検査一覧の検査日時が 9 時間ずれる（2026-10-21 に承認者が見つけた）。
# - 4 つのサービス（tsunagi-dicom・Orthanc は deploy/compose.yaml、dicom-test-generator・storescp はここ）は restart: unless-stopped。
#   Docker が起き直したときに、一式がそろって立つ（止めたものは止めたまま）。
# - 作るイメージの名前には compose のプロジェクトの名前（COMPOSE_PROJECT_NAME。既定は下の name の tsunagi-dev）を入れる
#   （<プロジェクト>-tdg:local・<プロジェクト>-dcmtk:local。tsunagi-dicom は up.sh が <プロジェクト>-tsunagi:local で作る）。
#   一式を2つ立てても、片方を作り直したときに、もう片方のイメージの名前が付け替わらない。

name: tsunagi-dev

include:
  - path: ../../deploy/compose.yaml
    env_file: ./dev.env

services:
  tdg:
    # dicom-test-generator の Dockerfile から作る。版は commit で固定する（TDG_GIT_REF で替えられる）
    image: ${COMPOSE_PROJECT_NAME:-tsunagi-dev}-tdg:local
    build:
      # 既定は main の 52380eb（#19 のマージの後）
      context: https://github.com/jeysunit/dicom-test-generator.git#${TDG_GIT_REF:-52380eb2c294309fa7a607696114ee4406c42e0e}
    environment:
      DTG_WEB_PASSWORD_FILE: /run/secrets/tdg_web_password
      # 検査日・時刻を日本の時刻で書く（Orthanc の TZ と同じ）
      TZ: Asia/Tokyo
    volumes:
      # 送信先は Orthanc（orthanc:4242）。Web 画面はコンテナの中で 0.0.0.0 に bind する
      - ./tdg/app_config.yaml:/app/config/app_config.yaml:ro
      - tdg-state:/app/modality_state
      - tdg-output:/app/output
    secrets:
      - tdg_web_password
    ports:
      - "127.0.0.1:${DEV_TDG_WEB_PORT:-18080}:8080"
    networks:
      - dicom
    depends_on:
      orthanc:
        condition: service_healthy
    init: true
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

  storescp:
    # 結合の試験と同じ Dockerfile（docker/test/dcmtk）の DCMTK のイメージ。受けたファイルを検査の UID ごとのフォルダに置く
    image: ${COMPOSE_PROJECT_NAME:-tsunagi-dev}-dcmtk:local
    build: ../test/dcmtk
    init: true
    command:
      - storescp
      - --aetitle
      - DEV_SCP
      - --output-directory
      - /received
      - --sort-on-study-uid
      - study
      - "11112"
    volumes:
      - storescp-received:/received
    networks:
      - dicom
    healthcheck:
      test: ["CMD", "echoscu", "--aetitle", "DEV_HEALTH", "--call", "DEV_SCP", "127.0.0.1", "11112"]
      interval: 2s
      timeout: 5s
      retries: 30
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  tdg_web_password:
    file: ./secrets/tdg_web_password.txt

volumes:
  tdg-state:
  tdg-output:
  storescp-received:
