# PR で、lint・型・Vitest・Playwright（モック）・依存の確かめ・イメージの試しの作りを流す。
# main への push でも同じ試験を流す（イメージは出さない。イメージは image.yml が、版のタグ・手動・週に1回のときだけ出す）。
# 版のタグ・手動・週に1回では、image.yml がこの workflow を呼び（workflow_call）、通ってからイメージを出す。
# 実の画像サーバーにはつながない（BACKEND_MOCK=true と tests/fixtures の合成のデータだけ）。
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  # 起こした元の種類を入れる（image.yml から呼ぶ公開前の試験が、main への push の試験の待ちに取り消されないように）
  group: ci-${{ github.event_name }}-${{ github.ref }}
  # main への push の試験は、次の push で打ち切らない（どの merge で落ちたかを残すため）。続けて push したときは、待ちは新しい 1 件だけ残る
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Prisma の CLI が外（checkpoint.prisma.io）へ版の確かめを送らないようにする
  CHECKPOINT_DISABLE: "1"
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  check:
    name: lint・型・Vitest・依存の確かめ
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm --version
      - run: npm ci
      - name: 依存の確かめ（高い以上で落とす）
        run: npm audit --audit-level=high
      - name: 依存の確かめ（イメージの中の Prisma の CLI）
        working-directory: docker/prisma-cli
        run: npm audit --audit-level=high
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  e2e:
    name: Playwright（モック）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: npm run test:e2e
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  image-smoke:
    name: イメージの試しの作りと起動（push しない）
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          load: true
          push: false
          tags: tsunagi-dicom:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: モックと検証モードで起動し、画面・中継の範囲・書き込みの止めを確かめる
        run: |
          set -eu
          export TSUNAGI_IMAGE=tsunagi-dicom:ci BACKEND_MOCK=true AUTH_MODE=dev
          mkdir -p secrets
          openssl rand -base64 48 > secrets/session_secret.txt
          chmod 0644 secrets/session_secret.txt
          docker compose up -d --no-build
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3000/api/health && break
            sleep 2
          done
          curl -fsS http://127.0.0.1:3000/ | grep -q 'data-testid="study-count">8<'
          page="$(curl -fsS http://127.0.0.1:3000/)"
          case "$page" in *非医療機器*) echo '画面に「非医療機器」の表示が出ている'; exit 1;; esac
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3000/api/dicom-web/studies)" = 405
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/api/dicom-web/studies)" = 404
          test "$(docker compose exec -T tsunagi id -u)" != 0
      - name: 管理者のパスワードを戻すコマンドを、コンテナの中で流す（AUTH_MODE=local）
        run: |
          set -eu
          mkdir -p reset-secrets
          openssl rand -base64 48 > reset-secrets/session_secret.txt
          printf '%s\n' 'init7pass-Kw3x' > reset-secrets/initial_admin_password.txt
          chmod 0644 reset-secrets/*.txt
          docker run -d --name tsunagi-reset -p 127.0.0.1:3100:3000 \
            -e BACKEND_MOCK=true -e AUTH_MODE=local -e MFA_REQUIRED=false \
            -e SESSION_SECRET_FILE=/run/secrets/session_secret \
            -e INITIAL_ADMIN_USERNAME=admin1 -e INITIAL_ADMIN_PASSWORD_FILE=/run/secrets/initial_admin_password \
            -v "$PWD/reset-secrets/session_secret.txt:/run/secrets/session_secret:ro" \
            -v "$PWD/reset-secrets/initial_admin_password.txt:/run/secrets/initial_admin_password:ro" \
            tsunagi-dicom:ci
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3100/api/health && break
            sleep 2
          done
          login() {
            curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:3100/api/auth/login \
              -H 'Origin: http://127.0.0.1:3100' -H 'Content-Type: application/json' \
              -d "{\"username\":\"admin1\",\"password\":\"$1\"}"
          }
          test "$(login 'init7pass-Kw3x')" = 200
          # いない利用者は断る（終了コード 1。標準出力には何も出さない）
          out="$(docker exec tsunagi-reset node cli/reset-admin-password.mjs --user nobody1 2>/dev/null)" && exit 1
          test -z "$out"
          # 戻すと、標準出力に一時のパスワードが 1 行だけ出る
          pw="$(docker exec tsunagi-reset node cli/reset-admin-password.mjs --user admin1 --operator ci 2>/dev/null)"
          test "$(printf '%s\n' "$pw" | wc -l)" = 1
          test "$(login 'init7pass-Kw3x')" = 401
          test "$(login "$pw")" = 200
      - name: 起動の記録
        if: always()
        run: docker compose logs
