# 版のタグ（v*）の push、手動（workflow_dispatch）、週に1回（schedule）のときだけ、CI（ci.yml）を通してから、イメージを作って GHCR へ出し、
# digest に鍵の要らない署名（cosign・GitHub の OIDC）を付ける。main への push では出さない（main の試験は ci.yml が流す）。
# 版のタグの push：vX.Y.Z と sha-<短い hash>。手動（main を選ぶ）：sha-<短い hash> だけ。週に1回（main）：sha-<短い hash> と rebuild-YYYYMMDD（層の cache を使わない）。
# 作り直しと手動は版のタグ（vX.Y.Z）を付けない・上書きしない（semver のタグは、版のタグの push のときにしか作られない）。
# packages: write と id-token: write はイメージの仕事にだけ付ける（リポジトリ全体を読み書きにしない）。
name: Image

on:
  push:
    tags: ["v*"]
  schedule:
    # 毎週月曜 03:17（UTC）。イメージの中で apt で入れる Debian の包みの更新を取り込む
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    name: CI
    # 手動の実行は main からだけ（版のタグの上で流して、版のタグを作り直さないため）
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  image:
    name: イメージを作って GHCR へ
    needs: ci
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # cosign の鍵の要らない署名（GitHub の OIDC のトークンで、短い命の証明書を受ける）
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ghcr.io/jeysunit/tsunagi-dicom
          # タグは vX.Y.Z と sha-<短い hash>。作り直しには rebuild-YYYYMMDD（UTC の日付）も付ける。配備は版のタグか digest を指定する
          tags: |
            type=semver,pattern={{version}},prefix=v
            type=sha,prefix=sha-,format=short
            type=raw,value=rebuild-{{date 'YYYYMMDD'}},enable=${{ github.event_name == 'schedule' }}
          flavor: |
            latest=false
      - name: 版のタグがもう GHCR にあれば止める（実行のやり直しで版のタグを移さない）
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          IMAGE: ghcr.io/jeysunit/tsunagi-dicom
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          set -eu
          for tag in ${TAGS}; do
            case "$tag" in
              "${IMAGE}:v"*)
                if docker buildx imagetools inspect "$tag" > /dev/null 2>&1; then
                  echo "版のタグ ${tag} はもう出してある。上書きしない" >&2
                  exit 1
                fi
                ;;
            esac
          done
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: mode=max
          sbom: true
          # 週の作り直しでは層の cache を使わない（apt-get の層を作り直して、包みの更新を取り込む）
          no-cache: ${{ github.event_name == 'schedule' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: digest に署名する（タグには署名しない）
        env:
          IMAGE: ghcr.io/jeysunit/tsunagi-dicom
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -eu
          case "$DIGEST" in
            sha256:*) ;;
            *) echo "digest が取れていない: '${DIGEST}'" >&2; exit 1 ;;
          esac
          cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: 署名を確かめる（配備する側と同じ確かめ）
        env:
          IMAGE: ghcr.io/jeysunit/tsunagi-dicom
          DIGEST: ${{ steps.build.outputs.digest }}
          # 例：https://github.com/jeysunit/tsunagi-dicom/.github/workflows/image.yml@refs/heads/main
          IDENTITY: ${{ github.server_url }}/${{ github.workflow_ref }}
        run: |
          set -eu
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity "${IDENTITY}" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            > /dev/null
          echo "署名を確かめた: ${IMAGE}@${DIGEST}（${IDENTITY}）"
