# tsunagi-dicom を1つのコンテナで動かす例。名前は例の名前だけ（pacs.example.org）。
# 秘密は書かない：SESSION_SECRET と画像サーバーのパスワードは secret のファイルで渡す（リポジトリに入れない。/secrets/ は .gitignore）。
#
#   mkdir -p secrets
#   openssl rand -base64 48 > secrets/session_secret.txt
#   cp .env.example .env            # 施設の値を入れる（SESSION_SECRET は .env に書かない。下の secret のファイルで渡す）
#   # 最初の管理者（AUTH_MODE=local で利用者が1人もいないときだけ使う。最初のログインでパスワードを変える）
#   printf '%s\n' '<最初のパスワード>' > secrets/initial_admin_password.txt
#   docker compose up
#
# 最初の管理者を作った後は、INITIAL_ADMIN_* と secrets/initial_admin_password.txt を外してよい
# （利用者が1人でもいれば使わない。残してもパスワードを書き換えない）。
#
# secret のファイルは、コンテナの中の利用者（uid 1000）が読めるようにしておく（例：chmod 0644、か所有者を 1000 にする）。
#
# モックで画面を試すだけなら（画像サーバー無し。AUTH_MODE=dev はモックのときだけ起動する）：
#   mkdir -p secrets && openssl rand -base64 48 > secrets/session_secret.txt
#   BACKEND_MOCK=true AUTH_MODE=dev docker compose up
# このときも待ち受けは手元（127.0.0.1）だけにしてある。

services:
  tsunagi:
    # 既定は、このリポジトリから手元で作るイメージ（build: .）。
    # 配備では GHCR の版のタグか digest を TSUNAGI_IMAGE に指定する
    #（例：ghcr.io/jeysunit/tsunagi-dicom:v0.1.0、ghcr.io/jeysunit/tsunagi-dicom@sha256:…）
    image: ${TSUNAGI_IMAGE:-tsunagi-dicom:local}
    build: .
    ports:
      - "127.0.0.1:3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      BACKEND_KIND: ${BACKEND_KIND:-orthanc}
      BACKEND_MOCK: ${BACKEND_MOCK:-false}
      AUTH_MODE: ${AUTH_MODE:-local}
      # 値は secret のファイル（下の secrets）。SESSION_SECRET と同時には指定しない（起動しない）
      SESSION_SECRET_FILE: /run/secrets/session_secret
      # 最初の管理者（AUTH_MODE=local。下の secrets の initial_admin_password を有効にする）
      # INITIAL_ADMIN_USERNAME: admin
      # INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/initial_admin_password
      # 画像サーバーのパスワードを secret のファイルで渡すとき（下の secrets を有効にする）
      # BACKEND_PASSWORD_FILE: /run/secrets/backend_password
      # 自前の CA を渡すとき（下の volumes を有効にする）
      # BACKEND_CA_FILE: /etc/tsunagi/ca.pem
      DATABASE_URL: file:/data/tsunagi.db
    volumes:
      - tsunagi-data:/data
      # - ./ca.pem:/etc/tsunagi/ca.pem:ro
    secrets:
      - session_secret
      # - initial_admin_password
      # - backend_password
    init: true
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    restart: unless-stopped

secrets:
  session_secret:
    file: ./secrets/session_secret.txt
  # initial_admin_password:
  #   file: ./secrets/initial_admin_password.txt
  # backend_password:
  #   file: ./secrets/backend_password.txt

volumes:
  tsunagi-data:
